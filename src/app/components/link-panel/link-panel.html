<a [href]="href()" target="_blank" rel="noopener noreferrer"
    class="flex justify-between items-center border-2 border-gray-300 py-2.5 px-2 hover:border-amz-secondary hover:bg-amz-secondary/10 text-gray-600 hover:text-black rounded transition-colors duration-200 cursor-pointer">
    <div class="flex justify-start items-center gap-2">
        <ng-content></ng-content>
        <p class="text-sm md:text-base">{{ title() }}</p>
    </div>
    <icon-link-external [size]="20" class="" />
</a>
