<main class="w-full h-screen relative bg-amz-primary flex flex-col items-stretch">
    <section
        class="flex flex-col w-full max-w-5xl h-full m-auto bg-amz-neutral lg:my-8 lg:rounded-xl relative overflow-hidden shadow-lg shadow-amz-tertiary/40">
        <div class="w-full h-full relative">
            <router-outlet />
            <nav-bar />
        </div>
        <div class="w-full transition-all duration-500 h-0 max-h-[calc(100vh-50%)]"
            [class]="{'h-full': viewControlService.viewType() === ViewType.location}">
            <view-site-info [isVisible]="viewControlService.viewType() === ViewType.location"
                [site]="siteInteractionService.getSiteInfo()" />
        </div>
        <view-favorites />
        <view-about />
    </section>
</main>
